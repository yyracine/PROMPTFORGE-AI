<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Dark Navy Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#0F3057" />
      <stop offset="55%" stop-color="#08182B" />
      <stop offset="100%" stop-color="#050C16" />
    </radialGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Fiery Orange/Gold Gradient for Lightning & F -->
    <linearGradient id="fireGold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Metallic Anvil Body Gradient -->
    <linearGradient id="anvilMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="45%" stop-color="#334155" />
      <stop offset="85%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Metallic Highlight -->
    <linearGradient id="anvilRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Spark Core Glow -->
    <radialGradient id="sparkBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#F97316" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded Square App Icon Background -->
  <rect x="6" y="6" width="244" height="244" rx="52" fill="url(#bgGlow)" stroke="#1E3A5F" stroke-width="4" />

  <!-- Outer Neural Constellation Mesh -->
  <g stroke="#38BDF8" stroke-width="2" stroke-opacity="0.55">
    <polygon points="128,28 196,58 214,126 184,188 72,188 42,126 60,58" fill="none" />
    <line x1="128" y1="28" x2="95" y2="56" />
    <line x1="128" y1="28" x2="162" y2="56" />
    <line x1="60" y1="58" x2="95" y2="56" />
    <line x1="196" y1="58" x2="162" y2="56" />
    <line x1="42" y1="126" x2="72" y2="112" />
    <line x1="214" y1="126" x2="184" y2="112" />
    <line x1="60" y1="58" x2="72" y2="112" />
    <line x1="196" y1="58" x2="184" y2="112" />
  </g>

  <!-- Constellation Nodes -->
  <g fill="#38BDF8">
    <circle cx="128" cy="28" r="4" />
    <circle cx="196" cy="58" r="4.5" />
    <circle cx="214" cy="126" r="3.5" />
    <circle cx="184" cy="188" r="4" />
    <circle cx="72" cy="188" r="4" />
    <circle cx="42" cy="126" r="3.5" />
    <circle cx="60" cy="58" r="4.5" />
    <circle cx="95" cy="56" r="3" />
    <circle cx="162" cy="56" r="3" />
  </g>

  <!-- Letter "P" (Left, Neon Cyan) -->
  <path
    d="M66 124 V66 H94 C108 66 117 74 117 86 C117 98 108 106 94 106 H80 V124 Z M80 78 V94 H92 C99 94 103 91 103 86 C103 81 99 78 92 78 Z"
    fill="url(#cyanNeon)"
    stroke="#E0F2FE"
    stroke-width="1.5"
  />

  <!-- Letter "F" with Arrow Crossbar (Center-Right, Fiery Orange/Gold) -->
  <path
    d="M140 124 V66 H178 V79 H154 V90 H168 V85 L181 96 L168 107 V102 H154 V124 Z"
    fill="url(#fireGold)"
    stroke="#FEF08A"
    stroke-width="1.5"
  />

  <!-- Letter "A" (Right, Neon Cyan) -->
  <path
    d="M174 128 L194 74 H208 L228 128 H214 L210 116 H192 L188 128 Z M195 105 H207 L201 87 Z"
    fill="url(#cyanNeon)"
    stroke="#E0F2FE"
    stroke-width="1.5"
  />

  <!-- Central Lightning Bolt Striking the Anvil -->
  <path
    d="M142 36 L112 88 H129 L116 132 L154 78 H135 Z"
    fill="url(#fireGold)"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Intense Forge Spark Burst on Anvil Top -->
  <circle cx="125" cy="134" r="30" fill="url(#sparkBurst)" />

  <!-- Radiant Spark Rays -->
  <g stroke="#FEF08A" stroke-width="2.2" stroke-linecap="round">
    <line x1="125" y1="134" x2="96" y2="116" />
    <line x1="125" y1="134" x2="156" y2="116" />
    <line x1="125" y1="134" x2="104" y2="106" />
    <line x1="125" y1="134" x2="146" y2="108" />
  </g>

  <!-- Blacksmith Anvil -->
  <g>
    <!-- Anvil Horn (Left) -->
    <path
      d="M52 136 H94 V160 C74 160 58 150 52 136 Z"
      fill="url(#anvilMetal)"
      stroke="#94A3B8"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Horn Orange Reflection -->
    <path
      d="M57 140 C63 150 75 156 91 156"
      stroke="#F97316"
      stroke-width="3"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Anvil Main Body & Waist -->
    <path
      d="M94 132 H198 V146 C184 148 166 156 160 172 L168 198 H180 V214 H86 V198 H98 L106 172 C102 158 98 148 94 146 Z"
      fill="url(#anvilMetal)"
      stroke="#CBD5E1"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Anvil Top Face Glowing Rim -->
    <line x1="94" y1="133" x2="198" y2="133" stroke="url(#anvilRim)" stroke-width="4" stroke-linecap="round" />

    <!-- Anvil Base Blocks -->
    <rect x="84" y="198" width="26" height="16" rx="3" fill="#1E293B" stroke="#F97316" stroke-width="2" />
    <rect x="156" y="198" width="26" height="16" rx="3" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <!-- Anvil Arch Cutout -->
    <path d="M116 214 C116 198 150 198 150 214 Z" fill="#06101E" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Floating Forge Embers & Cyan Particles -->
  <g>
    <circle cx="106" cy="50" r="2.5" fill="#F97316" />
    <circle cx="148" cy="48" r="2.5" fill="#FACC15" />
    <circle cx="82" cy="172" r="2.5" fill="#F97316" />
    <circle cx="176" cy="168" r="2.5" fill="#38BDF8" />
    <circle cx="125" cy="162" r="2" fill="#FDE047" />
    <circle cx="140" cy="176" r="1.8" fill="#FB923C" />
  </g>
</svg>
